spring:
  application:
    name: article
  datasource:
    url: ${Datasource_URL}
    username: ${Datasource_Username}
    password: ${Datasource_Password}
    driver-class-name: ${Datasource_Driver}
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [email, profile]
            redirect-uri: "https://blog-app-backend-owjc.onrender.com/login/oauth2/code/google"
Frontend:
  URL: ${Frontend_URL}
  